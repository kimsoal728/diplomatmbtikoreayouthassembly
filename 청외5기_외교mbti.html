<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>외교 MBTI — 나의 외교 스타일은?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1e;--sf:#111827;--sf2:#1a2235;--bd:rgba(255,255,255,0.08);--bdh:rgba(255,255,255,0.2);--tx:#f0f4ff;--sub:rgba(240,244,255,0.55);--dim:rgba(240,244,255,0.3);--ac:#4f9cf9;--gd:#c9a84c;--gl:#e8c878;--gdim:rgba(201,168,76,0.15);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(79,156,249,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(79,156,249,0.04) 1px,transparent 1px);background-size:60px 60px;}
.orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;}
.o1{width:min(600px,80vw);height:min(600px,80vw);background:rgba(79,156,249,0.07);top:-20%;left:-10%;}
.o2{width:min(500px,70vw);height:min(500px,70vw);background:rgba(201,168,76,0.05);bottom:-20%;right:-10%;}
.w{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:0 clamp(1rem,4vw,2rem);}
.screen{display:none!important;}
.screen.active{display:block!important;}
#intro.active{display:flex!important;flex-direction:column;align-items:center;}
#loading.active{display:flex!important;flex-direction:column;align-items:center;justify-content:center;}

/* ── INTRO ── */
#intro{min-height:100vh;text-align:center;padding:clamp(2rem,6vh,4rem) clamp(1rem,4vw,2rem);justify-content:center;}
.ibadge{display:inline-flex;align-items:center;gap:8px;font-size:clamp(10px,2.5vw,12px);letter-spacing:.1em;text-transform:uppercase;color:var(--gd);border:1px solid rgba(201,168,76,.3);background:var(--gdim);padding:6px 18px;border-radius:99px;margin-bottom:clamp(1.5rem,4vh,2.5rem);animation:fup .6s ease both;}
.iglobe{font-size:clamp(52px,12vw,76px);margin-bottom:clamp(1rem,3vh,1.5rem);animation:fup .6s .1s ease both;display:block;}
.ititle{font-family:'Noto Serif KR',serif;font-size:clamp(1.8rem,6vw,3.4rem);font-weight:700;line-height:1.25;margin-bottom:clamp(.8rem,2vh,1rem);animation:fup .6s .15s ease both;}
.ititle span{background:linear-gradient(135deg,var(--ac),var(--gl));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.isub{font-size:clamp(13px,3.5vw,16px);color:var(--sub);line-height:1.8;max-width:460px;margin:0 auto clamp(1.5rem,4vh,2.5rem);animation:fup .6s .2s ease both;}
.imeta{display:flex;flex-wrap:wrap;gap:clamp(.8rem,3vw,2rem);justify-content:center;font-size:clamp(11px,3vw,13px);color:var(--dim);margin-bottom:clamp(1.5rem,4vh,2.5rem);animation:fup .6s .25s ease both;}
.imeta span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gd);vertical-align:middle;margin-right:6px;}
.nwrap{width:100%;max-width:380px;margin:0 auto clamp(1.2rem,3vh,1.8rem);animation:fup .6s .28s ease both;}
.nlbl{font-size:13px;color:var(--dim);margin-bottom:8px;text-align:left;display:block;}
.ninp{width:100%;padding:.9rem 1.1rem;background:var(--sf);border:1px solid var(--bd);border-radius:12px;color:var(--tx);font-family:'Noto Sans KR',sans-serif;font-size:clamp(14px,3.5vw,16px);outline:none;transition:border-color .2s;-webkit-appearance:none;}
.ninp::placeholder{color:var(--dim);}
.ninp:focus{border-color:var(--gd);}
.nerr{font-size:12px;color:#f87171;margin-top:6px;text-align:left;display:none;}
.sbtn{display:inline-flex;align-items:center;gap:10px;font-family:'Noto Sans KR',sans-serif;font-size:clamp(14px,3.5vw,16px);font-weight:700;color:#0a0f1e;background:linear-gradient(135deg,var(--gd),var(--gl));border:none;border-radius:99px;padding:clamp(.8rem,2.5vw,1rem) clamp(1.8rem,5vw,2.5rem);cursor:pointer;transition:transform .2s,box-shadow .2s;animation:fup .6s .32s ease both;box-shadow:0 0 40px rgba(201,168,76,.3);-webkit-tap-highlight-color:transparent;}
.sbtn:hover{transform:translateY(-2px);box-shadow:0 8px 50px rgba(201,168,76,.45);}
.sbtn:active{transform:scale(.97);}
.tprev{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:clamp(1.5rem,4vh,3rem);animation:fup .6s .4s ease both;}
.tchip{font-size:clamp(11px,2.8vw,12px);padding:5px 13px;border:1px solid var(--bd);border-radius:99px;color:var(--dim);background:var(--sf);}
.alink{margin-top:clamp(1.2rem,3vh,2rem);animation:fup .6s .45s ease both;}
.alink button{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;text-decoration:underline;font-family:'Noto Sans KR',sans-serif;-webkit-tap-highlight-color:transparent;}
.alink button:hover{color:var(--sub);}

/* ── MODAL ── */
.mbd{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:1.5rem;}
.mbd.open{display:flex;}
.mbox{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:clamp(1.5rem,5vw,2rem);width:100%;max-width:360px;}
.mtitle{font-size:16px;font-weight:700;margin-bottom:1rem;}
.minp{width:100%;padding:.8rem 1rem;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;color:var(--tx);font-family:'Noto Sans KR',sans-serif;font-size:15px;outline:none;margin-bottom:.6rem;-webkit-appearance:none;}
.minp:focus{border-color:var(--gd);}
.merr{font-size:12px;color:#f87171;margin-bottom:.8rem;display:none;}
.mbtns{display:flex;gap:8px;}
.mcancel{flex:1;padding:.75rem;background:none;border:1px solid var(--bd);border-radius:10px;color:var(--sub);font-family:'Noto Sans KR',sans-serif;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.mcancel:hover{background:var(--sf2);}
.mok{flex:1;padding:.75rem;background:linear-gradient(135deg,var(--gd),var(--gl));border:none;border-radius:10px;color:#0a0f1e;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.mok:hover{opacity:.9;}

/* ── QUIZ ── */
#quiz{padding:clamp(1rem,3vh,2rem) 0 clamp(3rem,8vh,5rem);min-height:100vh;}
.qhdr{display:flex;justify-content:space-between;align-items:center;padding:clamp(1rem,3vh,1.5rem) 0 clamp(1rem,3vh,1.8rem);}
.qlogo{font-family:'Noto Serif KR',serif;font-size:14px;color:var(--gd);}
.qright{text-align:right;}
.qcnt{font-size:13px;color:var(--dim);}
.qnam{font-size:12px;color:var(--sub);margin-top:2px;}
.ptrack{width:100%;height:3px;background:var(--bd);border-radius:99px;margin-bottom:clamp(1.5rem,5vh,2.5rem);overflow:hidden;}
.pfill{height:100%;background:linear-gradient(90deg,var(--ac),var(--gd));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.qsc{font-size:clamp(10px,2.5vw,11px);letter-spacing:.1em;text-transform:uppercase;color:var(--gd);margin-bottom:.8rem;display:flex;align-items:center;gap:8px;}
.qsc::before{content:"";display:inline-block;width:20px;height:1px;background:var(--gd);}
.qctx{background:var(--sf2);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:0 10px 10px 0;padding:clamp(.8rem,2.5vw,1rem) clamp(.9rem,3vw,1.2rem);font-size:clamp(12px,3vw,14px);color:var(--sub);line-height:1.75;margin-bottom:clamp(1rem,3vh,1.5rem);}
.qmain{font-family:'Noto Serif KR',serif;font-size:clamp(1rem,3.5vw,1.25rem);font-weight:600;line-height:1.6;margin-bottom:clamp(1rem,3vh,1.8rem);}
.opts{display:flex;flex-direction:column;gap:clamp(8px,2vw,10px);margin-bottom:clamp(1.5rem,4vh,2.5rem);}
.opt{display:flex;align-items:flex-start;gap:clamp(10px,3vw,14px);padding:clamp(.85rem,3vw,1.05rem) clamp(1rem,3vw,1.3rem);background:var(--sf);border:1px solid var(--bd);border-radius:14px;cursor:pointer;transition:border-color .2s,background .2s,transform .15s;text-align:left;width:100%;-webkit-tap-highlight-color:transparent;}
.opt:active{transform:scale(.98);}
@media(hover:hover){.opt:hover{border-color:var(--bdh);background:var(--sf2);transform:translateX(4px);}}
.opt.sel{border-color:var(--gd);background:var(--gdim);}
@media(hover:hover){.opt.sel{transform:translateX(4px);}}
.oa{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--dim);transition:background .2s,border-color .2s,color .2s;margin-top:1px;}
.opt.sel .oa{background:var(--gd);border-color:var(--gd);color:#0a0f1e;}
.ot{font-size:clamp(13px,3.5vw,14px);line-height:1.65;color:var(--tx);}
.opt.sel .ot{color:var(--gl);}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.nbk{font-size:clamp(13px,3.5vw,14px);color:var(--dim);background:none;border:1px solid var(--bd);border-radius:99px;padding:clamp(.55rem,2vw,.65rem) clamp(1rem,3vw,1.3rem);cursor:pointer;transition:color .2s,border-color .2s;-webkit-tap-highlight-color:transparent;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;}
.nbk:hover{color:var(--tx);border-color:var(--bdh);}
.nbk:disabled{opacity:.2;cursor:default;}
.nnx{font-size:clamp(14px,3.5vw,15px);font-weight:700;color:#0a0f1e;background:linear-gradient(135deg,var(--gd),var(--gl));border:none;border-radius:99px;padding:clamp(.65rem,2vw,.75rem) clamp(1.5rem,4vw,2rem);cursor:pointer;transition:opacity .2s,transform .15s,box-shadow .2s;box-shadow:0 0 30px rgba(201,168,76,.2);-webkit-tap-highlight-color:transparent;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;}
.nnx:hover{transform:translateY(-1px);box-shadow:0 6px 30px rgba(201,168,76,.35);}
.nnx:active{transform:scale(.97);}
.nnx:disabled{opacity:.25;cursor:default;transform:none;box-shadow:none;}

/* ── LOADING ── */
#loading{min-height:100vh;gap:1.5rem;}
.lrings{position:relative;width:70px;height:70px;}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;animation:spin 1.2s linear infinite;}
.ring:nth-child(1){border-top-color:var(--gd);}
.ring:nth-child(2){border-right-color:var(--ac);inset:10px;animation-duration:1s;animation-direction:reverse;}
.ring:nth-child(3){border-bottom-color:var(--gl);inset:20px;animation-duration:.8s;}
@keyframes spin{to{transform:rotate(360deg);}}
.ltxt{font-size:15px;color:var(--sub);}

/* ── RESULT ── */
#result{padding:clamp(1.5rem,4vh,3rem) 0 clamp(4rem,10vh,6rem);min-height:100vh;}
.rhdr{text-align:center;padding:clamp(1rem,3vh,2rem) 0 clamp(1.5rem,4vh,2.5rem);}
.reye{font-size:clamp(11px,2.8vw,12px);letter-spacing:.12em;text-transform:uppercase;color:var(--gd);margin-bottom:1.5rem;}
.remblem{width:clamp(80px,20vw,110px);height:clamp(80px,20vw,110px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,10vw,50px);margin:0 auto 1.5rem;border:2px solid rgba(201,168,76,.4);background:var(--gdim);animation:pulse 3s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,0);}50%{box-shadow:0 0 0 18px rgba(201,168,76,.07);}}
.rname{font-family:'Noto Serif KR',serif;font-size:clamp(1.5rem,5.5vw,2.3rem);font-weight:700;margin-bottom:.4rem;background:linear-gradient(135deg,#fff,var(--gl));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.rkw{font-size:clamp(12px,3vw,14px);color:var(--gd);letter-spacing:.06em;margin-bottom:.5rem;}
.rnotice{font-size:clamp(11px,2.8vw,12px);color:var(--dim);background:var(--sf2);border-radius:8px;padding:6px 14px;display:inline-block;margin-bottom:2rem;}

/* result sections */
.rsec{margin-bottom:2.5rem;}
.stitle{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:1rem;display:flex;align-items:center;gap:8px;}
.stitle::after{content:"";flex:1;height:1px;background:var(--bd);}

/* desc card */
.rdesc{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:clamp(1.3rem,4vw,2rem);text-align:left;}
.rdesc p{font-size:clamp(13px,3.5vw,15px);line-height:1.9;color:var(--sub);}
.rcore{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:1.2rem;}
.rcore-item{background:var(--sf2);border-radius:10px;padding:.9rem 1rem;}
.rcore-lbl{font-size:11px;color:var(--dim);letter-spacing:.05em;margin-bottom:4px;}
.rcore-val{font-size:clamp(12px,3vw,13px);color:var(--tx);font-weight:500;}

/* jobs */
.job-grid{display:flex;flex-direction:column;gap:10px;}
.job-card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:clamp(1rem,3vw,1.2rem) clamp(1rem,3vw,1.3rem);display:flex;gap:14px;align-items:flex-start;}
.job-icon{font-size:clamp(22px,6vw,28px);flex-shrink:0;margin-top:2px;}
.job-info{}
.job-title{font-size:clamp(13px,3.5vw,15px);font-weight:700;margin-bottom:3px;}
.job-org{font-size:clamp(11px,2.8vw,12px);color:var(--gd);margin-bottom:6px;}
.job-desc{font-size:clamp(12px,3vw,13px);color:var(--sub);line-height:1.65;}

/* figures */
.fig-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
.fig-card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:clamp(1rem,3vw,1.2rem);}
.fig-name{font-size:clamp(13px,3.5vw,15px);font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.fig-role{font-size:clamp(11px,2.8vw,12px);color:var(--gd);margin-bottom:8px;}
.fig-desc{font-size:clamp(11px,2.8vw,12px);color:var(--sub);line-height:1.65;}

/* chart */
.clist{display:flex;flex-direction:column;gap:14px;}
.cmeta{display:flex;justify-content:space-between;margin-bottom:5px;}
.clbl{font-size:clamp(12px,3vw,13px);color:var(--sub);}
.cpct{font-size:clamp(12px,3vw,13px);font-weight:700;}
.ctrack{height:7px;background:var(--bd);border-radius:99px;overflow:hidden;}
.cfill{height:100%;border-radius:99px;width:0;transition:width 1.1s cubic-bezier(.4,0,.2,1);}

/* partner */
.partner-card{background:var(--sf);border:2px solid var(--bd);border-radius:20px;padding:clamp(1.3rem,4vw,1.8rem);display:flex;gap:16px;align-items:flex-start;}
.partner-left{flex-shrink:0;}
.partner-emblem{width:clamp(52px,14vw,68px);height:clamp(52px,14vw,68px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,7vw,32px);border:2px solid rgba(201,168,76,.25);background:var(--gdim);}
.partner-right{}
.partner-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gd);margin-bottom:4px;}
.partner-name{font-family:'Noto Serif KR',serif;font-size:clamp(1rem,4vw,1.25rem);font-weight:700;margin-bottom:4px;}
.partner-kw{font-size:clamp(11px,2.8vw,12px);color:var(--gd);margin-bottom:10px;}
.partner-desc{font-size:clamp(12px,3vw,13px);color:var(--sub);line-height:1.7;}
.partner-why{margin-top:10px;padding:10px 12px;background:var(--sf2);border-radius:10px;font-size:clamp(11px,2.8vw,12px);color:var(--sub);line-height:1.65;}
.partner-why strong{color:var(--gl);font-weight:500;}

.retry-wrap{text-align:center;padding-top:1rem;}
.retry-btn{font-family:'Noto Sans KR',sans-serif;font-size:14px;color:var(--sub);background:none;border:1px solid var(--bd);border-radius:99px;padding:.7rem 1.8rem;cursor:pointer;transition:color .2s,border-color .2s;-webkit-tap-highlight-color:transparent;}
.retry-btn:hover{color:var(--tx);border-color:var(--bdh);}

/* ── ADMIN ── */
#admin{padding:clamp(1.5rem,4vh,2.5rem) 0 clamp(3rem,8vh,5rem);min-height:100vh;}
.adhdr{display:flex;justify-content:space-between;align-items:flex-start;padding:clamp(1rem,3vh,1.5rem) 0 clamp(1.5rem,4vh,2.5rem);flex-wrap:wrap;gap:10px;}
.adbadge{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gd);margin-bottom:4px;}
.adtitle{font-family:'Noto Serif KR',serif;font-size:clamp(1.2rem,4vw,1.6rem);font-weight:700;}
.adexit{font-size:13px;color:var(--dim);background:none;border:1px solid var(--bd);border-radius:99px;padding:.5rem 1rem;cursor:pointer;font-family:'Noto Sans KR',sans-serif;-webkit-tap-highlight-color:transparent;transition:color .2s;}
.adexit:hover{color:var(--tx);}
.adstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:clamp(8px,2vw,12px);margin-bottom:clamp(1.5rem,4vh,2.5rem);}
.stcrd{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:clamp(.9rem,3vw,1.2rem);text-align:center;}
.stemi{font-size:clamp(20px,5vw,26px);margin-bottom:6px;}
.stnum{font-size:clamp(1.2rem,4vw,1.6rem);font-weight:700;margin-bottom:2px;}
.stlbl{font-size:clamp(10px,2.5vw,11px);color:var(--dim);line-height:1.4;}
.frow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:clamp(1rem,3vh,1.5rem);}
.fbtn{font-size:clamp(11px,3vw,13px);padding:6px 14px;border:1px solid var(--bd);border-radius:99px;background:var(--sf);color:var(--dim);cursor:pointer;transition:all .2s;font-family:'Noto Sans KR',sans-serif;-webkit-tap-highlight-color:transparent;}
.fbtn:hover{color:var(--tx);border-color:var(--bdh);}
.fbtn.on{border-color:transparent;}
.rlist{display:flex;flex-direction:column;gap:clamp(8px,2vw,10px);margin-bottom:1.5rem;}
.rrow{display:flex;align-items:center;gap:clamp(10px,3vw,14px);background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:clamp(.9rem,3vw,1.1rem) clamp(1rem,3vw,1.2rem);transition:border-color .2s;}
.rrow:hover{border-color:var(--bdh);}
.rnum{font-size:12px;color:var(--dim);width:22px;flex-shrink:0;text-align:center;}
.remi{font-size:clamp(18px,5vw,22px);flex-shrink:0;}
.rinfo{flex:1;min-width:0;}
.rnam{font-size:clamp(13px,3.5vw,15px);font-weight:500;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rtyp{font-size:clamp(11px,2.8vw,12px);color:var(--dim);}
.rtim{font-size:clamp(10px,2.5vw,11px);color:var(--dim);flex-shrink:0;}
.empty{text-align:center;padding:3rem 1rem;color:var(--dim);font-size:14px;}
.ei{font-size:40px;margin-bottom:1rem;}
.adbot{display:flex;justify-content:flex-end;}
.adclr{font-size:12px;color:var(--dim);background:none;border:1px solid rgba(248,113,113,.2);border-radius:99px;padding:.5rem 1rem;cursor:pointer;font-family:'Noto Sans KR',sans-serif;-webkit-tap-highlight-color:transparent;transition:color .2s,border-color .2s;}
.adclr:hover{color:#f87171;border-color:rgba(248,113,113,.5);}

/* ANIM */
@keyframes fup{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.fi{animation:fup .5s ease both;}
.si{animation:slideIn .35s ease both;}
@keyframes slideIn{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>

<!-- MODAL -->
<div class="mbd" id="amd">
  <div class="mbox">
    <div class="mtitle">🔐 관리자 로그인</div>

const shuf=QS.map(q=>{const a=[...q.opts];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;});
function getRec(){try{return JSON.parse(localStorage.getItem('dip5_res')||'[]');}catch(e){return[];}}
function saveRec(r){const a=getRec();a.push(r);localStorage.setItem('dip5_res',JSON.stringify(a));}
function clrRec(){localStorage.removeItem('dip5_res');}

/* ════════════════════════════════
   SCREEN
════════════════════════════════ */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}

/* ════════════════════════════════
   MODAL
════════════════════════════════ */
function openA(){document.getElementById('amd').classList.add('open');document.getElementById('ainp').value='';document.getElementById('aerr').style.display='none';setTimeout(()=>document.getElementById('ainp').focus(),100);}
function closeA(){document.getElementById('amd').classList.remove('open');}
function chkA(){const v=document.getElementById('ainp').value;if(v===AC){closeA();showAdm();}else{document.getElementById('aerr').style.display='block';document.getElementById('ainp').value='';}}
document.getElementById('amd').addEventListener('click',function(e){if(e.target===this)closeA();});

/* ════════════════════════════════
   QUIZ
════════════════════════════════ */
function startQ(){const n=document.getElementById('ninp').value.trim();const e=document.getElementById('nerr');if(!n){e.style.display='block';document.getElementById('ninp').focus();return;}e.style.display='none';uname=n;cur=0;ans=new Array(QS.length).fill(null);show('quiz');document.getElementById('qnam').textContent=n+'님';render();}
const LB=['A','B','C','D','E'];
function render(){const q=QS[cur];document.getElementById('qcnt').textContent=`${cur+1} / ${QS.length}`;document.getElementById('pfill').style.width=`${(cur/QS.length)*100}%`;const oh=shuf[cur].map((o,i)=>`<button class="opt${ans[cur]===i?' sel':''}" onclick="pick(${i})"><span class="oa">${LB[i]}</span><span class="ot">${o.t}</span></button>`).join('');document.getElementById('qbody').innerHTML=`<div class="qsc si">${q.sc}</div><div class="qctx si">${q.cx}</div><div class="qmain si">${q.q}</div><div class="opts si">${oh}</div>`;document.getElementById('bprev').disabled=cur===0;const nb=document.getElementById('bnxt');nb.disabled=ans[cur]===null;nb.textContent=cur===QS.length-1?'결과 보기 →':'다음 →';}
function pick(i){ans[cur]=i;render();}
function prevQ(){if(cur>0){cur--;render();}}
function nextQ(){if(ans[cur]===null)return;if(cur<QS.length-1){cur++;render();}else{show('loading');setTimeout(calc,2000);}}

/* ════════════════════════════════
   RESULT
════════════════════════════════ */
function calc(){
  const c={R:0,L:0,F:0,C:0,N:0};
  ans.forEach((a,qi)=>{if(a!==null)c[shuf[qi][a].y]++;});
  const s=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  const tk=s[0][0]; const tp=T[tk]; const tot=QS.length;
  const pt=T[tp.partner];

  saveRec({name:uname,tk,tn:tp.name,em:tp.emoji,kw:tp.kw,
    time:new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})});

  const coreHtml=tp.cores.map(x=>`<div class="rcore-item"><div class="rcore-lbl">${x.l}</div><div class="rcore-val">${x.v}</div></div>`).join('');
  const jobHtml=tp.jobs.map(j=>`<div class="job-card"><div class="job-icon">${j.icon}</div><div class="job-info"><div class="job-title">${j.title}</div><div class="job-org">${j.org}</div><div class="job-desc">${j.desc}</div></div></div>`).join('');
  const figHtml=tp.figs.map(f=>`<div class="fig-card"><div class="fig-name">${f.name}</div><div class="fig-role">${f.era}</div><div class="fig-desc">${f.desc}</div></div>`).join('');
  const barHtml=Object.entries(T).map(([k,t])=>{const p=Math.round((c[k]/tot)*100);return`<div><div class="cmeta"><span class="clbl">${t.emoji} ${t.name}</span><span class="cpct" style="color:${t.color}">${p}%</span></div><div class="ctrack"><div class="cfill" data-p="${p}" style="background:${t.color}"></div></div></div>`;}).join('');

  document.getElementById('rcont').innerHTML=`
    <div class="rhdr fi">
      <div class="reye">🌐 ${uname}님의 외교 유형 결과</div>
      <div class="remblem">${tp.emoji}</div>
      <div class="rname">${tp.name}</div>
      <div class="rkw">${tp.kw}</div>
      <div class="rnotice">※ 이 검사는 외교 이론에 기반한 수업 활동용 유형 탐색 도구입니다.</div>
    </div>

    <div class="rsec fi">
      <div class="stitle">유형 상세 설명</div>
      <div class="rdesc"><p>${tp.desc}</p><div class="rcore">${coreHtml}</div></div>
    </div>

    <div class="rsec fi">
      <div class="stitle">이 유형에 어울리는 실제 외교 직무</div>
      <div class="job-grid">${jobHtml}</div>
    </div>

    <div class="rsec fi">
      <div class="stitle">이 유형을 대표하는 역사적 인물</div>
      <div class="fig-grid">${figHtml}</div>
    </div>

    <div class="rsec fi">
      <div class="stitle">나의 외교 스타일 분포</div>
      <div class="clist">${barHtml}</div>
    </div>

    <div class="rsec fi">
      <div class="stitle">찰떡궁합 유형</div>
      <div class="partner-card">
        <div class="partner-left"><div class="partner-emblem">${pt.emoji}</div></div>
        <div class="partner-right">
          <div class="partner-label">Best Partner</div>
          <div class="partner-name">${pt.name}</div>
          <div class="partner-kw">${pt.kw}</div>
          <div class="partner-desc">${pt.desc.slice(0,90)}...</div>
          <div class="partner-why"><strong>궁합 이유 :</strong> ${tp.partnerWhy}</div>
        </div>
      </div>
    </div>

    <div class="retry-wrap fi"><button class="retry-btn" onclick="restart()">↺ 다시 검사하기</button></div>`;

  show('result');
  setTimeout(()=>{document.querySelectorAll('.cfill').forEach(el=>{el.style.width=el.dataset.p+'%';});},200);
}
function restart(){cur=0;ans=new Array(QS.length).fill(null);document.getElementById('ninp').value='';show('intro');}

/* ════════════════════════════════
   ADMIN
════════════════════════════════ */
let af='all';
function showAdm(){renderAdm();show('admin');}
function exitA2(){show('intro');}
function renderAdm(){
  const recs=getRec();
  const tc={R:0,L:0,F:0,C:0,N:0};
  recs.forEach(r=>{if(tc[r.tk]!==undefined)tc[r.tk]++;});
  document.getElementById('adstats').innerHTML=`<div class="stcrd"><div class="stemi">👥</div><div class="stnum">${recs.length}</div><div class="stlbl">총 참여자</div></div>${Object.entries(T).map(([k,t])=>`<div class="stcrd"><div class="stemi">${t.emoji}</div><div class="stnum" style="color:${t.color}">${tc[k]}</div><div class="stlbl">${t.name}</div></div>`).join('')}`;
  document.getElementById('frow').innerHTML=`<button class="fbtn${af==='all'?' on':''}" style="${af==='all'?'background:var(--gd);color:#0a0f1e;':''}" onclick="setF('all')">전체 (${recs.length})</button>${Object.entries(T).map(([k,t])=>`<button class="fbtn${af===k?' on':''}" style="${af===k?`background:${t.color};color:#0a0f1e;`:''}" onclick="setF('${k}')">${t.emoji} ${tc[k]}</button>`).join('')}`;
  const fl=af==='all'?recs:recs.filter(r=>r.tk===af);
  const le=document.getElementById('rlist');
  if(fl.length===0){le.innerHTML=`<div class="empty"><div class="ei">📭</div>아직 참여자가 없습니다.</div>`;return;}
  le.innerHTML=fl.slice().reverse().map((r,i)=>`<div class="rrow"><div class="rnum">${fl.length-i}</div><div class="remi">${r.em}</div><div class="rinfo"><div class="rnam">${r.name}</div><div class="rtyp">${r.tn} · ${r.kw}</div></div><div class="rtim">${r.time||''}</div></div>`).join('');
}
function setF(f){af=f;renderAdm();}
function clrAll(){if(confirm('전체 데이터를 초기화할까요?')){clrRec();renderAdm();}}
function exitAdm(){show('intro');}
</script>
</body>
</html>
